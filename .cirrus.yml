task:
  name: Build (Alpine Linux)
  container:
    image: alpine:3.23
    cpu: 8
  environment:
    PATH: "$HOME/.cargo/bin:$PATH"
  cargo_cache:
    folder: $HOME/.cargo/registry
    fingerprint_script: cat Cargo.lock
  install_script:
    - apk --update add gcc musl-dev cargo oniguruma-dev
  test_script:
    - RUSTONIG_SYSTEM_LIBONIG=1 cargo test
  before_cache_script: rm -rf $HOME/.cargo/registry/index
